name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Verify bundled entrypoint is up to date
        run: |
          npm run build
          # Runtime bundle files must match; source maps are not deterministic.
          if git status --porcelain dist | grep -qv '\.map$'; then
            echo "::error::dist runtime files differ from source — run 'npm run build' with Node 24 and commit the result."
            git diff --stat dist
            exit 1
          fi
