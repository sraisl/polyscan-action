name: Release (build + tag)

# Manual release: click "Run workflow" on the Actions tab.
# Builds dist/, then tags the CURRENT remote main with the next semver (vX.Y.Z) and moves the
# floating major tag (vX) to point at it, pushing ONLY tags (no main push — main is
# branch-protected, so we never commit dist to main here).
#
# v1..v15 are legacy tags from before this workflow adopted semver + a floating major tag;
# they are left untouched. The new scheme starts at v2.0.0 / floating v2 to avoid reusing v1.
#
# If you want dist committed to main, open a PR; this workflow only produces release tags.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (current main)
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build dist (verify it matches committed)
        run: |
          npm run build
          if git status --porcelain dist | grep -qv '\.map$'; then
            echo "::error::dist runtime files differ from source."
            git diff --stat dist
            exit 1
          fi

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          LATEST=${LATEST:-1.0.0}
          echo "latest = v${LATEST}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          # v1 is already taken by a legacy pre-semver tag; start the new scheme at v2.0.0.
          if [ "$MAJOR" -lt 2 ]; then MAJOR=2; MINOR=0; PATCH=0; fi
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next = ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=v${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Tag current main + move floating major tag, push tags only
        run: |
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git tag -f "${{ steps.version.outputs.major }}" "${{ steps.version.outputs.version }}"
          # push ONLY tags, never main (branch protection blocks main pushes)
          git push origin "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.major }}" --force
