name: "PolyScan SAST Security Scanner"
description: "Multi-language SAST scan with Quality Gate, SARIF, CycloneDX SBOM and job summary — native TypeScript action"
author: "Stefan Raisl"
branding:
  icon: "shield"
  color: "red"

inputs:
  target:
    description: "Workspace-contained directory to scan"
    required: false
    default: "."
  engines:
    description: "Comma-separated engines to run, or 'all': semgrep,opengrep,bandit,eslint,spotbugs,trivy,detekt,gitleaks,betterleaks,gosec,hadolint,zizmor,trufflehog (all excludes opt-in opengrep and trufflehog)"
    required: false
    default: "all"
  opengrep-config:
    description: "OpenGrep rules config: auto, local path, URL, or registry ID (used only when opengrep is selected)"
    required: false
    default: "auto"
  max-concurrency:
    description: "Maximum number of read-only engines to run concurrently (1-10); SpotBugs always runs as a serial barrier"
    required: false
    default: "2"
  max-critical:
    description: "Max critical findings allowed before the Quality Gate fails"
    required: false
    default: "0"
  max-high:
    description: "Max high findings allowed before the Quality Gate fails"
    required: false
    default: "0"
  max-medium:
    description: "Max medium findings allowed before the Quality Gate fails"
    required: false
    default: "50"
  gate:
    description: "Enforce the Quality Gate (fail the job when thresholds are exceeded)"
    required: false
    default: "true"
  fail-on-engine-error:
    description: "Fail the action when a requested scan engine cannot complete"
    required: false
    default: "true"
  sarif:
    description: "Write a SARIF 2.1.0 report (polyscan.sarif)"
    required: false
    default: "true"
  sbom:
    description: "Write a CycloneDX SBOM (polyscan.sbom.json)"
    required: false
    default: "false"
  upload-artifacts:
    description: "Upload SARIF + SBOM as workflow artifacts"
    required: false
    default: "true"
  upload-sarif:
    description: "Emit a hint for uploading SARIF to GitHub code scanning (needs a follow-up upload-sarif step)"
    required: false
    default: "false"
  trivy-image:
    description: "Docker image to scan with 'trivy image' (e.g. myapp:latest). Requires the image to be available in the local Docker daemon. Runs in addition to the filesystem scan."
    required: false
    default: ""
  output-dir:
    description: "Workspace-contained directory for generated reports"
    required: false
    default: "."

outputs:
  total:
    description: "Total number of findings"
  critical:
    description: "Number of critical findings"
  high:
    description: "Number of high findings"
  medium:
    description: "Number of medium findings"
  low:
    description: "Number of low findings"
  gate-passed:
    description: "'true' if the Quality Gate passed, otherwise 'false'"
  info:
    description: "Number of informational findings"
  engines-passed:
    description: "'true' if every requested engine completed or was skipped as not applicable"
  failed-engines:
    description: "Comma-separated engines that failed to complete"
  sarif-file:
    description: "Path to the generated SARIF file (if any)"
  sbom-file:
    description: "Path to the generated SBOM file (if any)"

runs:
  using: "node24"
  main: "dist/index.js"
